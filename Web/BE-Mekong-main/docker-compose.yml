services:
  thuyvan-db:
    image: postgres:17
    container_name: thuyvan-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-full_web_org}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a local .env before starting PostgreSQL}
      POSTGRES_DB: ${DB_NAME:-neondb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Mount thư mục init.sql vào đúng nơi Postgres yêu cầu để chạy tự động
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      # Lưu trữ dữ liệu vật lý để khi xóa container không bị mất data
      - thuyvan-db-data:/var/lib/postgresql/data

volumes:
  thuyvan-db-data:
